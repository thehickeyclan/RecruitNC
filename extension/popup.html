<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 300px; margin: 0; padding: 14px; font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #0b1426; color: #fff; }
      h1 { margin: 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #a3e635; }
      #status { margin: 8px 0; color: #ffffffc0; }
      #list a { display: block; padding: 6px 0; color: #fff; border-bottom: 1px solid #ffffff14; text-decoration: none; font-weight: 600; }
      #list a:hover { color: #a3e635; }
      button { margin-top: 10px; width: 100%; border-radius: 9px; padding: 9px; font-weight: 900; font-size: 14px; cursor: pointer; }
      #fill { background: #a3e635; color: #0a1628; border: 0; }
      #fill:disabled { opacity: 0.5; }
      #open { background: none; color: #fff; border: 1px solid #ffffff40; }
      a { color: #a3e635; }
      p.small { margin-top: 10px; font-size: 11px; color: #ffffff80; }
    </style>
  </head>
  <body>
    <h1>RecruitWrestlers · Interest forms</h1>
    <div id="status">Loading…</div>
    <div id="list"></div>
    <button id="fill">Fill this page</button>
    <button id="open">Open my Interest forms</button>
    <p class="small">We fill the boxes; you check them and press Submit on the college's page. We never submit for you.</p>
    <script src="dist/popup.js"></script>
  </body>
</html>
